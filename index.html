<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur de notes sombre</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .hidden {
            display: none !important;
        }
        #authContainer {
            background-color: #252526;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        #authContainer input {
            display: block;
            width: 250px;
            padding: 10px;
            margin: 10px auto;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #333333;
            border-radius: 4px;
        }
        #authContainer button {
            padding: 10px 20px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #authContainer button:hover {
            background-color: #005999;
        }
        .notepad {
            width: 80%;
            max-width: 600px;
            height: 70vh;
            background-color: #252526;
            border: 1px solid #333333;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .notepad-header {
            background-color: #2d2d2d;
            padding: 10px 15px;
            font-size: 14px;
            color: #9cdcfe;
            border-bottom: 1px solid #333333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notepad-header button {
            background: none;
            border: 1px solid #9cdcfe;
            color: #9cdcfe;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .notepad-header button:hover {
            background-color: #9cdcfe;
            color: #1e1e1e;
        }
        .notepad-content {
            flex: 1;
            background-color: #1e1e1e;
            color: #9cdcfe;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Formulaire de connexion -->
    <div id="authContainer">
        <h3>Connexion requise</h3>
        <input type="email" id="email" placeholder="Adresse e-mail">
        <input type="password" id="password" placeholder="Mot de passe">
        <button id="loginBtn">Se connecter</button>
    </div>

    <!-- Lecteur de notes (masqué par défaut) -->
    <div id="notepadContainer" class="notepad hidden">
        <div class="notepad-header">
            <span>Mon Lecteur de notes</span>
            <button id="logoutBtn">Se déconnecter</button>
        </div>
        <div class="notepad-content">C'est ici que vous écrivez votre texte dans le code HTML. 
Il s'affichera à l'écran mais il sera impossible de le modifier directement depuis la page web.</div>
    </div>

    <!-- Script Firebase Auth -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDl_lYpPenVuLeK1Gg-W-nf7QUS0_zFnO8",
            authDomain: "bloc-note-prive.firebaseapp.com",
            projectId: "bloc-note-prive",
            storageBucket: "bloc-note-prive.firebasestorage.app",
            messagingSenderId: "666956249120",
            appId: "1:666956249120:web:cb1183c8b58a1b1663a445",
            measurementId: "G-217318KNQT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const authContainer = document.getElementById('authContainer');
        const notepadContainer = document.getElementById('notepadContainer');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // Gestion de l'état de connexion en temps réel
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.classList.add('hidden');
                notepadContainer.classList.remove('hidden');
            } else {
                authContainer.classList.remove('hidden');
                notepadContainer.classList.add('hidden');
            }
        });

        // Connexion au clic
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            } catch (error) {
                alert("Erreur de connexion : " + error.message);
            }
        });

        // Déconnexion au clic
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Erreur de déconnexion", error);
            }
        });
    </script>

</body>
</html>
