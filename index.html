<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloc-Notes Privé</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f4f9;
    }
    h1 {
      color: #333;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Mes Notes Privées</h1>
  <textarea id="noteInput" placeholder="Écrivez votre idée ou votre note ici..."></textarea>
  <br>
  <button id="saveBtn">Enregistrer dans Firestore</button>

  <!-- Script Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    // Votre configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDl_lYpPenVuLeK1Gg-W-nf7QUS0_zFnO8",
      authDomain: "bloc-note-prive.firebaseapp.com",
      projectId: "bloc-note-prive",
      storageBucket: "bloc-note-prive.firebasestorage.app",
      messagingSenderId: "666956249120",
      appId: "1:666956249120:web:cb1183c8b58a1b1663a445",
      measurementId: "G-217318KNQT"
    };

    // Initialisation
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    // Écouteur d'événement sur le bouton d'enregistrement
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();

      if (!text) {
        alert("Veuillez écrire un texte avant d'enregistrer !");
        return;
      }

      try {
        const docRef = await addDoc(collection(db, "idees"), {
          texte: text,
          date: new Date().toISOString()
        });

        alert("Note enregistrée avec succès !");
        input.value = ''; // Réinitialise le champ texte
      } catch (e) {
        console.error("Erreur lors de l'enregistrement : ", e);
        alert("Une erreur s'est produite lors de l'enregistrement.");
      }
    });
  </script>

</body>
</html>
