<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur de notes sombre</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .notepad {
            width: 80%;
            max-width: 600px;
            height: 70vh;
            background-color: #252526;
            border: 1px solid #333333;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .notepad-header {
            background-color: #2d2d2d;
            padding: 10px 15px;
            font-size: 14px;
            color: #9cdcfe;
            border-bottom: 1px solid #333333;
        }
        .notepad-content {
            flex: 1;
            background-color: #1e1e1e;
            color: #9cdcfe;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="notepad">
        <div class="notepad-header">Mon Lecteur de notes</div>
        <div class="notepad-content">Test
Salut !
Ça va ?
Alors les choses à faire :
- Faire l'appel
- Imprimer/reproduire mon EDT</div>
    </div>

</body>
</html>
